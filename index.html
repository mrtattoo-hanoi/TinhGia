<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình chọn lưới ảnh với cắt ảnh và kéo chọn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }
        #imageContainer {
            position: relative;
            display: inline-block;
        }
        #gridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #cursorOverlay {
            position: absolute;
            background: rgba(255, 255, 0, 0.3);
            border: 2px solid rgba(255, 255, 0, 0.7);
            pointer-events: none;
            display: none;
        }
        #cropOverlay {
            position: absolute;
            border: 2px dashed blue;
            background: rgba(0, 0, 255, 0.1);
            pointer-events: none;
            display: none;
        }
        #selectOverlay {
            position: absolute;
            border: 2px dashed rgba(255, 255, 0, 0.7);
            background: rgba(255, 255, 0, 0.2);
            pointer-events: none;
            display: none;
        }
        #controls {
            margin: 20px 0;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
        #imageInfo {
            margin-top: 10px;
        }
        #zoomContainer {
            margin-top: 10px;
        }
        #selectionMode, #areaSize, #cropMode {
            margin-top: 10px;
        }
#resultVND, #resultEUR {
    margin-top: 10px;
    font-weight: bold;
}
#cropOverlay {
    position: absolute;
    border: 2px dashed blue;
    background: rgba(0, 0, 255, 0.1);
    pointer-events: auto; /* Cho phép tương tác với handle */
    display: none;
}

.resize-handle {
    position: absolute;
    width: 16px;
    height: 16px;
    background: rgba(0, 0, 255, 0.8);
    border: 1px solid white;
    cursor: pointer;
    z-index: 10;
}

.resize-handle.top-left {
    top: -8px;
    left: -8px;
    cursor: nwse-resize;
}

.resize-handle.top-right {
    top: -8px;
    right: -8px;
    cursor: nesw-resize;
}

.resize-handle.bottom-left {
    bottom: -8px;
    left: -8px;
    cursor: nesw-resize;
}

.resize-handle.bottom-right {
    bottom: -8px;
    right: -8px;
    cursor: nwse-resize;
}
 #zoomSlider {
  width: 100%;
  max-width: 400px;
  margin-top: 5px;
}
.resize-handle.top {
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    cursor: ns-resize;
}

.resize-handle.right {
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    cursor: ew-resize;
}

.resize-handle.bottom {
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    cursor: ns-resize;
}

.resize-handle.left {
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    cursor: ew-resize;
}
    </style>
</head>
<body>
    <div id="controls">
        <input type="file" id="imageInput" accept="image/*">
        <div id="imageInfo">Kích thước ảnh: Chưa tải ảnh</div>
        <div>
            <label>Chiều ngang (mm): </label>
            <input type="number" id="widthMm" min="1" placeholder="Nhập chiều ngang">
        </div>
        <div>
            <label>Chiều dọc (mm): </label>
            <input type="number" id="heightMm" min="1" placeholder="Nhập chiều dọc">
        </div>
        <br>
        <div>
    <label>Chế độ giá: </label>
    <label><input type="radio" name="priceMode" value="auto" checked> Tự động</label>
    <label><input type="radio" name="priceMode" value="manual"> Thủ công</label>
</div>
<div id="manualPriceInput">
    <label>Price per cm² (USD): </label>
    <input type="number" id="pricePerCell" min="0" step="0.01" value="1">
</div>
         <br>
        <div style="font-style: italic; font-size: 14px; color: grey;">
    1->25=0.8-1 | 26->100=0.6-0.8 | 101->199=0.5-0.7
</div>
<div style="font-style: italic; font-size: 14px; color: grey;">
    200->299=0.45-0.6 | &gt;300=0.4-0.5
</div>
<div id="zoomContainer">
    <label>Thu phóng ảnh:</label><br>
    <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
</div>
<div>
<br>
            <label>Kích thước ô (cm²): </label>
            <select id="cellSize">
                <option value="2" selected>2x2</option>
                <option value="3">3x3</option>
                <option value="4">4x4</option>
                <option value="5">5x5</option>
                <option value="6">6x6</option>
                <option value="7">7x7</option>
                <option value="8">8x8</option>
                <option value="9">9x9</option>
                <option value="10">10x10</option>
            </select>
        </div>
        <div id="areaSize">
            <label>Kích thước vùng chọn: </label>
            <select id="selectionAreaSize">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
            </select>
        </div>
        <div id="selectionMode">
    <label><input type="radio" name="mode" value="select" checked> Chọn ô</label>
    <label><input type="radio" name="mode" value="deselect"> Xóa ô</label>   
<label><input type="radio" name="mode" value="crop"> Cắt ảnh</label> 
    <br><br>
    <div id="selectMethodOptions">
        <label><input type="radio" name="selectMethod" value="move" checked> Di chuyển chuột</label>
        <label><input type="radio" name="selectMethod" value="drag"> Kéo để chọn</label>
    </div>
</div>
<br>
        <div style="display: flex; gap: 10px; align-items: center;">
    <button onclick="createGrid()">Tạo lưới</button>
    <div id="cropMode" style="display: none;">
        <button onclick="cropImage()">Cắt</button>
    </div>
</div>
<br>
   <div id="imageContainer">
    <img id="displayImage" style="display: none;">
    <canvas id="gridCanvas"></canvas>
    <div id="cursorOverlay"></div>
    <div id="cropOverlay">
        <div class="resize-handle top-left"></div>
        <div class="resize-handle top-right"></div>
        <div class="resize-handle bottom-left"></div>
        <div class="resize-handle bottom-right"></div>
    <div class="resize-handle top-left"></div>
    <div class="resize-handle top-right"></div>
    <div class="resize-handle bottom-left"></div>
    <div class="resize-handle bottom-right"></div>
    <div class="resize-handle top"></div>
    <div class="resize-handle right"></div>
    <div class="resize-handle bottom"></div>
    <div class="resize-handle left"></div>
    </div>
    <div id="selectOverlay"></div>
</div>
<div id="totalArea" style="font-weight: bold;">Total area: 0 cm² (0 cells)</div>
<div id="pricePerCm2" style="margin-top: 10px; font-weight: bold;"></div>
<div id="resultVND"></div>
<div id="totalPrice" style="font-weight: bold;">Total amount (USD): $0</div>
<div id="resultEUR"></div>
<div id="exchangeRate"></div>
<br>
<button onclick="checkPrice()">Check Price</button>

    <script>
const imageInput = document.getElementById('imageInput');
const displayImage = document.getElementById('displayImage');
const gridCanvas = document.getElementById('gridCanvas');
const cursorOverlay = document.getElementById('cursorOverlay');
const cropOverlay = document.getElementById('cropOverlay');
const selectOverlay = document.getElementById('selectOverlay');
const pricePerCellInput = document.getElementById('pricePerCell');
const widthMmInput = document.getElementById('widthMm');
const heightMmInput = document.getElementById('heightMm');
const cellSizeInput = document.getElementById('cellSize');
const zoomSlider = document.getElementById('zoomSlider');
const imageInfo = document.getElementById('imageInfo');
const result = document.getElementById('result');
const selectionAreaSize = document.getElementById('selectionAreaSize');
const selectionModeInputs = document.getElementsByName('mode');
const selectMethodInputs = document.getElementsByName('selectMethod');
const cropModeDiv = document.getElementById('cropMode');
const imageContainer = document.getElementById('imageContainer');
let selectedCells = 0;
let selectedCellIndices = [];
let isSelecting = false;
let isCropping = false;
let isDragging = false;
let isResizing = false;
let resizeHandle = null;
let startX, startY;
let originalWidthPx, originalHeightPx, aspectRatio;
let cropData = null;
let selectData = null;
const ctx = gridCanvas.getContext('2d');

const priceModeInputs = document.getElementsByName('priceMode');
const manualPriceInput = document.getElementById('manualPriceInput');

priceModeInputs.forEach(input => {
    input.addEventListener('change', function() {
        manualPriceInput.style.display = input.value === 'manual' ? 'block' : 'none';
        updateResult();
    });
});

function getPricePerCm2(totalAreaCm2) {
    if (totalAreaCm2 <= 6) return 2.5;
    if (totalAreaCm2 <= 16) return 2.2;
    if (totalAreaCm2 <= 25) return 2.0;
    if (totalAreaCm2 <= 36) return 1.8;
    if (totalAreaCm2 <= 49) return 1.6;
    if (totalAreaCm2 <= 64) return 1.4;
    if (totalAreaCm2 <= 81) return 1.2;
    if (totalAreaCm2 <= 100) return 1.0;
    return 0.8;
}

imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            displayImage.src = e.target.result;
            displayImage.style.display = 'block';
            cropData = null;
            selectData = null;
            isSelecting = false;
            isCropping = false;
            isDragging = false;
            isResizing = false;
            cropOverlay.style.display = 'none';
            selectOverlay.style.display = 'none';
            cursorOverlay.style.display = 'none';
            cropModeDiv.style.display = 'none';
            selectionModeInputs[0].checked = true;
            selectMethodInputs[0].checked = true;
            selectedCells = 0;
            selectedCellIndices = [];
            displayImage.onload = function() {
                originalWidthPx = displayImage.naturalWidth;
                originalHeightPx = displayImage.naturalHeight;
                aspectRatio = originalWidthPx / originalHeightPx;
                imageInfo.textContent = `Kích thước ảnh: ${Math.round(originalWidthPx)}px x ${Math.round(originalHeightPx)}px`;
                updateDimensions();
                ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
            };
        };
        reader.readAsDataURL(file);
    }
});

widthMmInput.addEventListener('change', function() {
    if (widthMmInput.value && aspectRatio) {
        heightMmInput.value = (widthMmInput.value / aspectRatio).toFixed(2);
    }
    updateDimensions();
});

heightMmInput.addEventListener('change', function() {
    if (heightMmInput.value && aspectRatio) {
        widthMmInput.value = (heightMmInput.value * aspectRatio).toFixed(2);
    }
    updateDimensions();
});

cellSizeInput.addEventListener('change', function() {
    createGrid();
    updateResult();
});

selectionAreaSize.addEventListener('change', function() {
    updateResult();
});

zoomSlider.addEventListener('input', updateDimensions);

selectionModeInputs.forEach(input => {
    input.addEventListener('change', function() {
        isSelecting = false;
        isResizing = false;
        isCropping = input.value === 'crop';
        cursorOverlay.style.display = 'none';
        selectOverlay.style.display = 'none';
        cropModeDiv.style.display = isCropping ? 'block' : 'none';
        document.getElementById('selectMethodOptions').style.display = isCropping ? 'none' : 'block';
        
        if (isCropping && displayImage.src && displayImage.style.display !== 'none') {
            const containerRect = imageContainer.getBoundingClientRect();
            cropOverlay.style.display = 'block';
            cropOverlay.style.left = '0px';
            cropOverlay.style.top = '0px';
            cropOverlay.style.width = `${containerRect.width}px`;
            cropOverlay.style.height = `${containerRect.height}px`;
            cropData = { 
                startX: 0, 
                startY: 0, 
                width: containerRect.width, 
                height: containerRect.height 
            };
        } else {
            cropOverlay.style.display = 'none';
            cropData = null;
        }
        
        if (!isCropping) {
            createGrid();
        }
    });
});

selectMethodInputs.forEach(input => {
    input.addEventListener('change', function() {
        isSelecting = false;
        isDragging = input.value === 'drag';
        cursorOverlay.style.display = 'none';
        selectOverlay.style.display = 'none';
    });
});

function getCellCounts() {
    const widthMm = parseFloat(widthMmInput.value) || 0;
    const heightMm = parseFloat(heightMmInput.value) || 0;
    const cellSize = parseInt(cellSizeInput.value);

    const widthCm = widthMm / 10;
    const widthInteger = Math.floor(widthCm);
    const widthDecimal = widthCm - widthInteger;
    let baseWidth;
    if (widthDecimal < 0.1) {
        baseWidth = widthInteger;
    } else if (widthDecimal <= 0.5) {
        baseWidth = widthInteger + 0.5;
    } else {
        baseWidth = widthInteger + 1;
    }

    const heightCm = heightMm / 10;
    const heightInteger = Math.floor(heightCm);
    const heightDecimal = heightCm - heightInteger;
    let baseHeight;
    if (heightDecimal < 0.1) {
        baseHeight = heightInteger;
    } else if (heightDecimal <= 0.5) {
        baseHeight = heightInteger + 0.5;
    } else {
        baseHeight = heightInteger + 1;
    }

    const widthCells = baseWidth * cellSize;
    const heightCells = baseHeight * cellSize;
    return { widthCells: Math.max(1, widthCells), heightCells: Math.max(1, heightCells) };
}

function updateDimensions() {
    const zoom = parseFloat(zoomSlider.value);
    let widthPx, heightPx;

    if (!originalWidthPx || !originalHeightPx || isNaN(originalWidthPx) || isNaN(originalHeightPx)) {
        return;
    }

    const defaultDisplayWidth = 500;
    if (widthMmInput.value && aspectRatio) {
        const widthMm = parseFloat(widthMmInput.value);
        const heightMm = widthMm / aspectRatio;
        heightMmInput.value = heightMm.toFixed(2);
        widthPx = widthMm * 3.779527559 * zoom;
        heightPx = heightMm * 3.779527559 * zoom;
    } else if (heightMmInput.value && aspectRatio) {
        const heightMm = parseFloat(heightMmInput.value);
        const widthMm = heightMm * aspectRatio;
        widthMmInput.value = widthMm.toFixed(2);
        widthPx = widthMm * 3.779527559 * zoom;
        heightPx = heightMm * 3.779527559 * zoom;
    } else {
        widthPx = defaultDisplayWidth * zoom;
        heightPx = (defaultDisplayWidth / aspectRatio) * zoom;
        widthMmInput.value = (widthPx / 3.779527559 / zoom).toFixed(2);
        heightMmInput.value = (heightPx / 3.779527559 / zoom).toFixed(2);
    }

    displayImage.style.width = `${widthPx}px`;
    displayImage.style.height = `${heightPx}px`;
    gridCanvas.width = widthPx;
    gridCanvas.height = heightPx;

    if (!isCropping) {
        createGrid();
    } else if (cropData) {
        cropOverlay.style.width = `${Math.min(cropData.width, widthPx)}px`;
        cropOverlay.style.height = `${Math.min(cropData.height, heightPx)}px`;
        cropData.width = Math.min(cropData.width, widthPx);
        cropData.height = Math.min(cropData.height, heightPx);
    }
}

function createGrid() {
    const { widthCells, heightCells } = getCellCounts();
    if (!widthCells || !heightCells || widthCells < 1 || heightCells < 1) {
        alert('Vui lòng nhập kích thước ảnh hợp lệ!');
        return;
    }
    if (!displayImage.src || displayImage.style.display === 'none') {
        alert('Vui lòng tải ảnh trước!');
        return;
    }

    selectedCellIndices = selectedCellIndices.filter(([row, col]) => row < heightCells && col < widthCells);
    selectedCells = selectedCellIndices.length;

    const cellWidth = gridCanvas.width / widthCells;
    const cellHeight = gridCanvas.height / heightCells;

    ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= Math.floor(widthCells); i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellWidth, 0);
        ctx.lineTo(i * cellWidth, gridCanvas.height);
        ctx.stroke();
    }
    for (let i = 0; i <= Math.floor(heightCells); i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * cellHeight);
        ctx.lineTo(gridCanvas.width, i * cellHeight);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
    selectedCellIndices.forEach(([row, col]) => {
        let fillWidth = cellWidth;
        let fillHeight = cellHeight;
        if ((col + 1) * cellWidth > gridCanvas.width) {
            fillWidth = gridCanvas.width - col * cellWidth;
        }
        if ((row + 1) * cellHeight > gridCanvas.height) {
            fillHeight = gridCanvas.height - row * cellHeight;
        }
        ctx.fillRect(col * cellWidth, row * cellHeight, fillWidth, fillHeight);
    });

    updateResult();
}

function getPositionFromEvent(e) {
    const containerRect = imageContainer.getBoundingClientRect();
    let clientX, clientY;
    if (e.type.startsWith('touch')) {
        clientX = e.touches[0]?.clientX || e.changedTouches[0].clientX;
        clientY = e.touches[0]?.clientY || e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    return {
        x: Math.max(0, clientX - containerRect.left),
        y: Math.max(0, clientY - containerRect.top)
    };
}

function handleStart(e) {
    e.preventDefault();
    if (!displayImage.src || displayImage.style.display === 'none') return;

    const pos = getPositionFromEvent(e);
    const target = e.target;

    if (isCropping && target.classList.contains('resize-handle') && cropData) {
        isResizing = true;
        resizeHandle = target.className.split(' ')[1];
        return;
    }

    if (!isCropping && isDragging && !isSelecting) {
        isSelecting = true;
        startX = pos.x;
        startY = pos.y;
        selectOverlay.style.display = 'block';
        selectOverlay.style.left = `${startX}px`;
        selectOverlay.style.top = `${startY}px`;
        selectOverlay.style.width = '0px';
        selectOverlay.style.height = '0px';
        selectData = { startX, startY, width: 0, height: 0 };
    } else if (!isCropping && !isDragging) {
        isSelecting = true;
        const { widthCells, heightCells } = getCellCounts();
        const containerRect = imageContainer.getBoundingClientRect();
        const cellWidth = containerRect.width / widthCells;
        const cellHeight = containerRect.height / heightCells;
        const col = Math.floor(pos.x / cellWidth);
        const row = Math.floor(pos.y / cellHeight);
        if (row >= 0 && row < heightCells && col >= 0 && col < widthCells) {
            applyAreaSelection(row, col);
            updateCursorOverlay(pos, row, col);
            cursorOverlay.style.display = 'block';
        }
    }
}

function handleMove(e) {
    e.preventDefault();
    if (!displayImage.src || displayImage.style.display === 'none') return;

    const pos = getPositionFromEvent(e);
    const containerRect = imageContainer.getBoundingClientRect();
    const endX = Math.min(Math.max(pos.x, 0), containerRect.width);
    const endY = Math.min(Math.max(pos.y, 0), containerRect.height);

    if (isCropping && isResizing && cropData) {
        let { startX, startY, width, height } = cropData;
        switch (resizeHandle) {
            case 'top-left':
                width = cropData.startX + cropData.width - endX;
                height = cropData.startY + cropData.height - endY;
                startX = endX;
                startY = endY;
                break;
            case 'top-right':
                width = endX - cropData.startX;
                height = cropData.startY + cropData.height - endY;
                startY = endY;
                break;
            case 'bottom-left':
                width = cropData.startX + cropData.width - endX;
                height = endY - cropData.startY;
                startX = endX;
                break;
            case 'bottom-right':
                width = endX - cropData.startX;
                height = endY - cropData.startY;
                break;
            case 'top':
                height = cropData.startY + cropData.height - endY;
                startY = endY;
                break;
            case 'right':
                width = endX - cropData.startX;
                break;
            case 'bottom':
                height = endY - cropData.startY;
                break;
            case 'left':
                width = cropData.startX + cropData.width - endX;
                startX = endX;
                break;
        }
        if (width < 0) {
            startX += width;
            width = -width;
        }
        if (height < 0) {
            startY += height;
            height = -height;
        }
        cropOverlay.style.left = `${startX}px`;
        cropOverlay.style.top = `${startY}px`;
        cropOverlay.style.width = `${width}px`;
        cropOverlay.style.height = `${height}px`;
        cropData = { startX, startY, width, height };
    } else if (!isCropping && isDragging && isSelecting) {
        const left = Math.min(startX, endX);
        const top = Math.min(startY, endY);
        const width = Math.abs(endX - startX);
        const height = Math.abs(endY - startY);

        selectOverlay.style.left = `${left}px`;
        selectOverlay.style.top = `${top}px`;
        selectOverlay.style.width = `${width}px`;
        selectOverlay.style.height = `${height}px`;

        selectData = { startX: left, startY: top, width, height };
    } else if (!isCropping && !isDragging && isSelecting) {
        const { widthCells, heightCells } = getCellCounts();
        const containerRect = imageContainer.getBoundingClientRect();
        const cellWidth = containerRect.width / widthCells;
        const cellHeight = containerRect.height / heightCells;
        const col = Math.floor(pos.x / cellWidth);
        const row = Math.floor(pos.y / cellHeight);
        if (row >= 0 && row < heightCells && col >= 0 && col < widthCells) {
            applyAreaSelection(row, col);
            updateCursorOverlay(pos, row, col);
            cursorOverlay.style.display = 'block';
        }
    }
}

function handleEnd(e) {
    if (isCropping && isResizing) {
        isResizing = false;
        resizeHandle = null;
        if (cropData && cropData.width > 0 && cropData.height > 0) {
            // Giữ khung cắt hiển thị để tiếp tục điều chỉnh
        } else {
            cropOverlay.style.display = 'none';
            cropData = null;
        }
    } else if (!isCropping && isDragging && isSelecting) {
        isSelecting = false;
        selectOverlay.style.display = 'none';
        applyDragSelection();
    } else if (!isCropping && !isDragging && isSelecting) {
        isSelecting = false;
        cursorOverlay.style.display = 'none';
    }
}

function cropImage() {
    if (!cropData || cropData.width <= 0 || cropData.height <= 0) {
        alert('Vùng cắt không hợp lệ! Vui lòng chọn lại vùng cắt.');
        cropOverlay.style.display = 'none';
        cropData = null;
        return;
    }

    const containerRect = imageContainer.getBoundingClientRect();
    const zoom = parseFloat(zoomSlider.value);
    const currentWidthPx = parseFloat(displayImage.style.width) || displayImage.naturalWidth;
    const pixelRatio = originalWidthPx / currentWidthPx;

    const cropX = Math.max(0, cropData.startX * pixelRatio);
    const cropY = Math.max(0, cropData.startY * pixelRatio);
    const cropWidthPx = Math.min(originalWidthPx - cropX, cropData.width * pixelRatio);
    const cropHeightPx = Math.min(originalHeightPx - cropY, cropData.height * pixelRatio);

    if (cropWidthPx <= 0 || cropHeightPx <= 0 || isNaN(cropWidthPx) || isNaN(cropHeightPx)) {
        alert('Vùng cắt không hợp lệ! Vui lòng chọn lại vùng cắt.');
        cropOverlay.style.display = 'none';
        cropData = null;
        return;
    }

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = cropWidthPx;
    canvas.height = cropHeightPx;
    ctx.drawImage(displayImage, cropX, cropY, cropWidthPx, cropHeightPx, 0, 0, cropWidthPx, cropHeightPx);

    displayImage.src = canvas.toDataURL();
    originalWidthPx = cropWidthPx;
    originalHeightPx = cropHeightPx;
    aspectRatio = originalWidthPx / originalHeightPx;
    imageInfo.textContent = `Kích thước ảnh: ${Math.round(originalWidthPx)}px x ${Math.round(originalHeightPx)}px`;

    cropData = null;
    cropOverlay.style.display = 'none';
    selectedCellIndices = [];
    selectedCells = 0;

    updateDimensions();
    createGrid();
}

function applyDragSelection() {
    if (!selectData) return;

    const { widthCells, heightCells } = getCellCounts();
    const containerRect = imageContainer.getBoundingClientRect();
    const cellWidth = containerRect.width / widthCells;
    const cellHeight = containerRect.height / heightCells;

    const startCol = Math.floor(selectData.startX / cellWidth);
    const startRow = Math.floor(selectData.startY / cellHeight);
    const endCol = Math.min(widthCells, Math.floor((selectData.startX + selectData.width) / cellWidth));
    const endRow = Math.min(heightCells, Math.floor((selectData.startY + selectData.height) / cellHeight));

    const mode = Array.from(selectionModeInputs).find(input => input.checked).value;

    for (let i = startRow; i < endRow; i++) {
        for (let j = startCol; j < endCol; j++) {
            if (i >= 0 && i < heightCells && j >= 0 && j < widthCells) {
                const cellIndex = [i, j];
                if (mode === 'select') {
                    if (!selectedCellIndices.some(([r, c]) => r === i && c === j)) {
                        selectedCellIndices.push(cellIndex);
                        selectedCells++;
                    }
                } else if (mode === 'deselect') {
                    if (selectedCellIndices.some(([r, c]) => r === i && c === j)) {
                        selectedCellIndices = selectedCellIndices.filter(([r, c]) => r !== i || c !== j);
                        selectedCells--;
                    }
                }
            }
        }
    }

    selectData = null;
    createGrid();
}

function applyAreaSelection(row, col) {
    const size = parseInt(selectionAreaSize.value);
    const mode = Array.from(selectionModeInputs).find(input => input.checked).value;
    const { widthCells, heightCells } = getCellCounts();

    for (let i = row; i < Math.min(row + size, heightCells); i++) {
        for (let j = col; j < Math.min(col + size, widthCells); j++) {
            const cellIndex = [i, j];
            if (mode === 'select') {
                if (!selectedCellIndices.some(([r, c]) => r === i && c === j)) {
                    selectedCellIndices.push(cellIndex);
                    selectedCells++;
                }
            } else if (mode === 'deselect') {
                if (selectedCellIndices.some(([r, c]) => r === i && c === j)) {
                    selectedCellIndices = selectedCellIndices.filter(([r, c]) => r !== i || c !== j);
                    selectedCells--;
                }
            }
        }
    }
    createGrid();
}

function formatVND(number) {
    return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function updateCurrencyConversion(totalPriceUSD) {
    const resultVND = document.getElementById('resultVND');
    const resultEUR = document.getElementById('resultEUR');
    const exchangeRate = document.getElementById('exchangeRate');
    
    const defaultVndRate = 25300;
    const defaultEurRate = 0.92;

    const apiUrl = 'https://open.er-api.com/v6/latest/USD';

    fetch(apiUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            if (data.result === 'success' && data.rates) {
                const vndRate = data.rates.VND || defaultVndRate;
                const eurRate = 1 / data.rates.EUR || defaultEurRate;
                const totalPriceVND = (totalPriceUSD * vndRate).toFixed(0);
                const totalPriceEUR = (totalPriceUSD / eurRate).toFixed(2);
                resultVND.textContent = `Total amount (VND): ${formatVND(totalPriceVND)} VND`;
                resultEUR.textContent = `Total amount (EUR): €${totalPriceEUR}`;
                exchangeRate.textContent = `Exchange rate: 1 USD = ${formatVND(vndRate.toFixed(0))} VND | 1 EUR ≈ ${formatVND((vndRate / (1/eurRate)).toFixed(0))} VND`;
            } else {
                console.error('API error:', data.error || 'Unknown error from open.er-api');
                useDefaultRates(totalPriceUSD, defaultVndRate, defaultEurRate);
            }
        })
        .catch(error => {
            console.error('Lỗi khi lấy tỉ giá:', error.message);
            useDefaultRates(totalPriceUSD, defaultVndRate, defaultEurRate);
        });

    function useDefaultRates(totalPriceUSD, vndRate, eurRate) {
        const totalPriceVND = (totalPriceUSD * vndRate).toFixed(0);
        const totalPriceEUR = (totalPriceUSD / eurRate).toFixed(2);
        resultVND.textContent = `Total amount (VND): ${formatVND(totalPriceVND)} VND (tỷ giá mặc định)`;
        resultEUR.textContent = `Total amount (EUR): €${totalPriceEUR} (tỷ giá mặc định)`;
        exchangeRate.textContent = `Exchange rate: Lỗi API - Dùng mặc định (1 USD = ${formatVND(vndRate)} VND | 1 USD ≈ ${eurRate} EUR)`;
    }
}

function updateResult() {
    const cellSize = parseInt(cellSizeInput.value);
    const sochia = cellSize * cellSize;
    const totalAreaMm2 = selectedCells;
    const totalAreaCm2 = totalAreaMm2 / sochia;
    let pricePerCell;

    const priceMode = Array.from(priceModeInputs).find(input => input.checked).value;
    if (priceMode === 'auto') {
        pricePerCell = getPricePerCm2(totalAreaCm2);
    } else {
        pricePerCell = parseFloat(pricePerCellInput.value) || 0;
    }

    const totalPriceUSD = (totalAreaMm2 * pricePerCell / sochia).toFixed(2);
    document.getElementById('totalArea').textContent = `Total area: ${totalAreaCm2.toFixed(2)} cm² (${totalAreaMm2} cells)`;
    document.getElementById('totalPrice').textContent = `Total amount (USD): $${totalPriceUSD}`;
    
    const pricePerCm2Element = document.getElementById('pricePerCm2');
    if (totalAreaCm2 > 0) {
        const pricePerCm2 = (totalPriceUSD / totalAreaCm2).toFixed(2);
        pricePerCm2Element.textContent = `Price per cm²: $${pricePerCm2}`;
    } else {
        pricePerCm2Element.textContent = `Price per cm²: $0.00`;
    }
}

function checkPrice() {
    const cellSize = parseInt(cellSizeInput.value);
    const sochia = cellSize * cellSize;
    const totalAreaMm2 = selectedCells;
    const totalAreaCm2 = totalAreaMm2 / sochia;
    let pricePerCell;

    const priceMode = Array.from(priceModeInputs).find(input => input.checked).value;
    if (priceMode === 'auto') {
        pricePerCell = getPricePerCm2(totalAreaCm2);
    } else {
        pricePerCell = parseFloat(pricePerCellInput.value) || 0;
    }

    const totalPriceUSD = (totalAreaMm2 * pricePerCell / sochia).toFixed(2);
    document.getElementById('totalArea').textContent = `Total area: ${totalAreaCm2.toFixed(2)} cm² (${totalAreaMm2} cells)`;
    document.getElementById('totalPrice').textContent = `Total amount (USD): $${totalPriceUSD}`;
    
    const pricePerCm2Element = document.getElementById('pricePerCm2');
    if (totalAreaCm2 > 0) {
        const pricePerCm2 = (totalPriceUSD / totalAreaCm2).toFixed(2);
        pricePerCm2Element.textContent = `Price per cm²: $${pricePerCm2}`;
    } else {
        pricePerCm2Element.textContent = `Price per cm²: $0.00`;
    }
    
    updateCurrencyConversion(totalPriceUSD);
}

imageContainer.addEventListener('mousedown', handleStart);
imageContainer.addEventListener('mousemove', handleMove);
imageContainer.addEventListener('mouseup', handleEnd);
imageContainer.addEventListener('touchstart', handleStart, { passive: false });
imageContainer.addEventListener('touchmove', handleMove, { passive: false });
imageContainer.addEventListener('touchend', handleEnd, { passive: false });

imageContainer.addEventListener('mouseleave', function() {
    if (!isCropping && !isDragging) {
        cursorOverlay.style.display = 'none';
    }
});

imageContainer.addEventListener('mouseenter', function(e) {
    if (isSelecting && !isCropping && !isDragging) {
        const pos = getPositionFromEvent(e);
        const { widthCells, heightCells } = getCellCounts();
        const containerRect = imageContainer.getBoundingClientRect();
        const cellWidth = containerRect.width / widthCells;
        const cellHeight = containerRect.height / heightCells;
        const col = Math.floor(pos.x / cellWidth);
        const row = Math.floor(pos.y / cellHeight);
        if (row >= 0 && row < heightCells && col >= 0 && col < widthCells) {
            updateCursorOverlay(pos, row, col);
            cursorOverlay.style.display = 'block';
        }
    }
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && isCropping && cropData) {
        cropImage();
    } else if (e.key === 'Enter' && !isCropping && isDragging && selectData) {
        isSelecting = false;
        selectOverlay.style.display = 'none';
        applyDragSelection();
    }
});

function updateCursorOverlay(pos, row, col) {
    const size = parseInt(selectionAreaSize.value);
    const { widthCells, heightCells } = getCellCounts();
    const containerRect = imageContainer.getBoundingClientRect();
    const cellWidth = containerRect.width / widthCells;
    const cellHeight = containerRect.height / heightCells;

    const overlayWidth = Math.min(size, widthCells - col) * cellWidth;
    const overlayHeight = Math.min(size, heightCells - row) * cellHeight;
    const left = col * cellWidth;
    const top = row * cellHeight;

    cursorOverlay.style.width = `${overlayWidth}px`;
    cursorOverlay.style.height = `${overlayHeight}px`;
    cursorOverlay.style.left = `${left}px`;
    cursorOverlay.style.top = `${top}px`;
}
