<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình chọn lưới ảnh với cắt ảnh và kéo chọn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }
        #imageContainer {
            position: relative;
            display: inline-block;
        }
        #gridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #cursorOverlay {
            position: absolute;
            background: rgba(255, 255, 0, 0.3);
            border: 2px solid rgba(255, 255, 0, 0.7);
            pointer-events: none;
            display: none;
        }
        #cropOverlay {
            position: absolute;
            border: 2px dashed blue;
            background: rgba(0, 0, 255, 0.1);
            pointer-events: auto;
            display: none;
        }
        #selectOverlay {
            position: absolute;
            border: 2px dashed rgba(255, 255, 0, 0.7);
            background: rgba(255, 255, 0, 0.2);
            pointer-events: none;
            display: none;
        }
        #controls {
            margin: 20px 0;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
        #imageInfo {
            margin-top: 10px;
        }
        #zoomContainer {
            margin-top: 10px;
        }
        #selectionMode, #areaSize, #cropMode {
            margin-top: 10px;
        }
        #resultVND, #resultEUR {
            margin-top: 10px;
            font-weight: bold;
        }
        .resize-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: rgba(0, 0, 255, 0.8);
            border: 1px solid white;
            cursor: pointer;
            z-index: 10;
        }
        .resize-handle.top-left {
            top: -8px;
            left: -8px;
            cursor: nwse-resize;
        }
        .resize-handle.top-right {
            top: -8px;
            right: -8px;
            cursor: nesw-resize;
        }
        .resize-handle.bottom-left {
            bottom: -8px;
            left: -8px;
            cursor: nesw-resize;
        }
        .resize-handle.bottom-right {
            bottom: -8px;
            right: -8px;
            cursor: nwse-resize;
        }
        #zoomSlider {
            width: 100%;
            max-width: 400px;
            margin-top: 5px;
        }
        .resize-handle.top {
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            cursor: ns-resize;
        }
        .resize-handle.right {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }
        .resize-handle.bottom {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            cursor: ns-resize;
        }
        .resize-handle.left {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }
    </style>
</head>
<body>
    <div id="controls">
        <input type="file" id="imageInput" accept="image/*">
        <div id="imageInfo">Kích thước ảnh: Chưa tải ảnh</div>
        <div>
            <label>Chiều ngang (mm): </label>
            <input type="number" id="widthMm" min="1" placeholder="Nhập chiều ngang">
        </div>
        <div>
            <label>Chiều dọc (mm): </label>

        </div>
        <br>
        <div>
            <label>Chế độ giá: </label>
            <label><input type="radio" name="priceMode" value="auto" checked> Tự động</label>
            <label><input type="radio" name="priceMode" value="manual"> Thủ công</label>
        </div>
        <div id="manualPriceInput" style="display: none;">
            <label>Giá mỗi cm² (VNĐ): </label>
<input type="number" id="pricePerCell" min="0" step="1000" value="50000">
        </div>
        <div id="zoomContainer">
            <label>Thu phóng ảnh:</label><br>
            <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">

        <div>
            <br>
            <label>Kích thước ô (cm²): </label>
            <select id="cellSize">
                <option value="2" selected>2x2</option>

        </div>
        <div id="areaSize">

            <select id="selectionAreaSize">
                <option value="1">1</option>

                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>

 <div style="display: flex; gap: 5px; align-items: center; margin-bottom: 5px; margin-top: 10px;">

<!-- THÊM DÒNG NÀY -->
<div id="colorStats" style="margin-top: 10px; font-size: 14px; font-weight: bold; color: #333; padding: 5px; background: #f0f0f0; border-radius: 4px;"></div>
        <br>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <button onclick="createGrid()">Tạo lưới</button>
    <button onclick="autoSelect()" style="background: #4CAF50; color: white;">🤖 Chọn tự động</button>
    
    <!-- THÊM 2 NÚT MỚI TẠI ĐÂY -->

        <div id="cropMode" style="display: none;">

                <div class="resize-handle top-right"></div>

                <div class="resize-handle bottom-right"></div>

                <div class="resize-handle bottom"></div>

            </div>
            <div id="selectOverlay"></div>
<!-- THÊM CANVAS VẼ VÙNG TẠI ĐÂY -->
    <canvas id="drawCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <script>
const imageInput = document.getElementById('imageInput');
const displayImage = document.getElementById('displayImage');
const gridCanvas = document.getElementById('gridCanvas');
const cursorOverlay = document.getElementById('cursorOverlay');
const cropOverlay = document.getElementById('cropOverlay');
const selectOverlay = document.getElementById('selectOverlay');
const pricePerCellInput = document.getElementById('pricePerCell');
const widthMmInput = document.getElementById('widthMm');
const heightMmInput = document.getElementById('heightMm');
const cellSizeInput = document.getElementById('cellSize');
const zoomSlider = document.getElementById('zoomSlider');
const imageInfo = document.getElementById('imageInfo');
const result = document.getElementById('result');
const selectionAreaSize = document.getElementById('selectionAreaSize');
const selectionModeInputs = document.getElementsByName('mode');
const selectMethodInputs = document.getElementsByName('selectMethod');
const cropModeDiv = document.getElementById('cropMode');
const imageContainer = document.getElementById('imageContainer');
let selectedCells = 0;
let selectedCellIndices = [];
let isSelecting = false;
let isCropping = false;
let isDragging = false;
let isResizing = false;
let resizeHandle = null;
let startX, startY;
let originalWidthPx, originalHeightPx, aspectRatio;
let cropData = null;
let selectData = null;
const ctx = gridCanvas.getContext('2d');
// ← THÊM 3 DÒNG NÀY
let cachedImageData = null;
let cachedPixels = null;
let cachedTimestamp = 0;

let isDrawingRegion = false;
let drawPoints = [];          // mảng điểm {x, y}
let isDrawing = false;
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');

const priceModeInputs = document.getElementsByName('priceMode');
const manualPriceInput = document.getElementById('manualPriceInput');

// Khởi tạo trạng thái ban đầu cho difficultyOptions
document.addEventListener('DOMContentLoaded', function() {
    const selectedMode = Array.from(selectionModeInputs).find(input => input.checked).value;
    document.getElementById('difficultyOptions').style.display = selectedMode === 'select' ? 'block' : 'none';
    document.getElementById('selectMethodOptions').style.display = selectedMode === 'crop' ? 'none' : 'block';
});

priceModeInputs.forEach(input => {
    input.addEventListener('change', function() {
        manualPriceInput.style.display = input.value === 'manual' ? 'block' : 'none';
        updateResult();
    });
});

function tinhGiaXam(x) {
    // x: diện tích tính bằng cm²
    // Giá trả về đơn vị: VNĐ
    
    let giaK; // Giá tính theo nghìn đồng (k VND)
    if (x <= 2) {
        // Mốc min: dưới hoặc bằng 2 cm² tính 300k
        giaK = 300;
    } 
    else if (x > 2 && x <= 4) {
        // Nội suy mượt từ 2cm² (300k) lên 4cm² (400k)
        giaK = 300 + (x - 2) * 50;
    } 
    else if (x > 4 && x <= 30) {
        // Đoạn từ 4cm² đến 30cm² (đạt 800k ở 10cm² và 1500k ở 30cm²)
        giaK = 400 * Math.pow(x / 4, 0.61316);
    } 
    else {
        // Đoạn > 30cm² (đạt 6000k ở 300cm² và 9000k ở 600cm²)
        giaK = 1500 * Math.pow(x / 30, 0.59828);
    }
    // Nhân với 1000 và làm tròn đến hàng nghìn VNĐ
    return Math.round(giaK) * 1000;
}

imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            displayImage.src = e.target.result;
            displayImage.style.display = 'block';
            cropData = null;
            selectData = null;
            isSelecting = false;
            isCropping = false;
            isDragging = false;
            isResizing = false;
            cropOverlay.style.display = 'none';
            selectOverlay.style.display = 'none';
            cursorOverlay.style.display = 'none';
            cropModeDiv.style.display = 'none';
            selectionModeInputs[0].checked = true;
            selectMethodInputs[0].checked = true;
            selectedCells = 0;
            selectedCellIndices = [];
            displayImage.onload = function() {
                originalWidthPx = displayImage.naturalWidth;
                originalHeightPx = displayImage.naturalHeight;
                aspectRatio = originalWidthPx / originalHeightPx;
                imageInfo.textContent = `Kích thước ảnh: ${Math.round(originalWidthPx)}px x ${Math.round(originalHeightPx)}px`;
                updateDimensions();
                ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
            };
        };
        reader.readAsDataURL(file);
    }
});

widthMmInput.addEventListener('change', function() {
    if (widthMmInput.value && aspectRatio) {
        heightMmInput.value = (widthMmInput.value / aspectRatio).toFixed(2);
    }
    updateDimensions();
});

heightMmInput.addEventListener('change', function() {
    if (heightMmInput.value && aspectRatio) {
        widthMmInput.value = (heightMmInput.value * aspectRatio).toFixed(2);
    }
    updateDimensions();
});

cellSizeInput.addEventListener('change', function() {
    createGrid();
    updateResult();
});

selectionAreaSize.addEventListener('change', function() {
    updateResult();
});

selectionModeInputs.forEach(input => {
    input.addEventListener('change', function() {
        isSelecting = false;
        isResizing = false;
        isCropping = input.value === 'crop';
        isDrawingRegion = input.value === 'drawRegion';
        isDrawing = false;
        drawPoints = [];

        cursorOverlay.style.display = 'none';
        selectOverlay.style.display = 'none';
        cropModeDiv.style.display = isCropping ? 'block' : 'none';

        // Hiện / ẩn nút
        document.getElementById('confirmRegionBtn').style.display = isDrawingRegion ? 'inline-block' : 'none';
        document.getElementById('clearRegionBtn').style.display = isDrawingRegion ? 'inline-block' : 'none';

        // Hiện độ khó khi chọn ô hoặc vẽ vùng
        document.getElementById('difficultyOptions').style.display = 
            (input.value === 'select' || input.value === 'drawRegion') ? 'block' : 'none';

        document.getElementById('selectMethodOptions').style.display = 
            (isCropping || isDrawingRegion) ? 'none' : 'block';

        // ===== Xử lý canvas vẽ =====
        if (isDrawingRegion) {
            // Đảm bảo canvas có đúng kích thước
            drawCanvas.width = gridCanvas.width || imageContainer.clientWidth;
            drawCanvas.height = gridCanvas.height || imageContainer.clientHeight;
            drawCanvas.style.pointerEvents = 'auto';
            drawCanvas.style.zIndex = '20';          // đưa lên trên cùng
            clearDrawnRegion();
            console.log('Đã bật chế độ Vẽ vùng. Canvas size:', drawCanvas.width, 'x', drawCanvas.height);
        } else {
            drawCanvas.style.pointerEvents = 'none';
            drawCanvas.style.zIndex = '5';
            clearDrawnRegion();
        }

        if (isCropping && displayImage.src && displayImage.style.display !== 'none') {
            const containerRect = imageContainer.getBoundingClientRect();
            cropOverlay.style.display = 'block';
            cropOverlay.style.left = '0px';
            cropOverlay.style.top = '0px';
            cropOverlay.style.width = `${containerRect.width}px`;
            cropOverlay.style.height = `${containerRect.height}px`;
            cropData = { 
                startX: 0, 
                startY: 0, 
                width: containerRect.width, 
                height: containerRect.height 
            };
        } else {
            cropOverlay.style.display = 'none';
            cropData = null;
        }
        
        if (!isCropping && !isDrawingRegion) {
            createGrid();
        }
    });
});

selectMethodInputs.forEach(input => {
    input.addEventListener('change', function() {
        isSelecting = false;
        isDragging = input.value === 'drag';
        cursorOverlay.style.display = 'none';
        selectOverlay.style.display = 'none';
    });
});

function getCellCounts() {
    const widthMm = parseFloat(widthMmInput.value) || 0;
    const heightMm = parseFloat(heightMmInput.value) || 0;
    const cellSize = parseInt(cellSizeInput.value);

    const xyz = cellSize === 2 ? 0.5 :
                cellSize === 3 ? 1/3 :
                cellSize === 4 ? 0.25 :
                cellSize === 5 ? 0.2 :
                cellSize === 6 ? 1/6 :
                cellSize === 7 ? 1/7 :
                cellSize === 8 ? 1/8 :
                cellSize === 9 ? 1/9 :
                0.1;

    const widthCm = widthMm / 10;
    const heightCm = heightMm / 10;

    const fullWidthCells = Math.floor(widthCm / xyz);
    const remainderWidth = widthCm % xyz;
    const totalWidthCells = fullWidthCells + (remainderWidth > 0 ? 1 : 0);

    const fullHeightCells = Math.floor(heightCm / xyz);
    const remainderHeight = heightCm % xyz;
    const totalHeightCells = fullHeightCells + (remainderHeight > 0 ? 1 : 0);

    return { 
        fullWidthCells, totalWidthCells, remainderWidth, 
        fullHeightCells, totalHeightCells, remainderHeight, 
        xyz 
    };
}

function updateDimensions() {
    const zoom = parseFloat(zoomSlider.value) || 1;

    if (!originalWidthPx || !originalHeightPx || isNaN(originalWidthPx) || isNaN(originalHeightPx)) {
        return;
    }

    // ===== LUÔN CỐ ĐỊNH CHIỀU NGANG CƠ SỞ = 600px =====
    const baseDisplayWidth = 600;
    let widthPx = baseDisplayWidth * zoom;
    let heightPx = (baseDisplayWidth / aspectRatio) * zoom;

    // Gán kích thước hiển thị
    displayImage.style.width = `${widthPx}px`;
    displayImage.style.height = `${heightPx}px`;
    gridCanvas.width = widthPx;
    gridCanvas.height = heightPx;

    // Đồng bộ canvas vẽ vùng (nếu có)
    if (typeof drawCanvas !== 'undefined' && drawCanvas) {
        drawCanvas.width = widthPx;
        drawCanvas.height = heightPx;
    }

    // Nếu đang crop thì giới hạn khung crop
    if (isCropping && cropData) {
        cropOverlay.style.width = `${Math.min(cropData.width, widthPx)}px`;
        cropOverlay.style.height = `${Math.min(cropData.height, heightPx)}px`;
        cropData.width = Math.min(cropData.width, widthPx);
        cropData.height = Math.min(cropData.height, heightPx);
    }

    // Vẫn tạo lại lưới nếu không đang crop
    if (!isCropping) {
        createGrid();
    }
}

function getGridPositions() {
    const { totalWidthCells, remainderWidth, totalHeightCells, remainderHeight, xyz } = getCellCounts();
    const widthCm = parseFloat(widthMmInput.value) / 10;
    const heightCm = parseFloat(heightMmInput.value) / 10;
    const pixelPerCm = gridCanvas.width / widthCm;

    const cellWidthsCm = Array(totalWidthCells).fill(xyz);
    if (remainderWidth > 0) cellWidthsCm[totalWidthCells - 1] = remainderWidth;
    const cellHeightsCm = Array(totalHeightCells).fill(xyz);
    if (remainderHeight > 0) cellHeightsCm[totalHeightCells - 1] = remainderHeight;

    const xPositions = [0];
    for (let i = 0; i < totalWidthCells; i++) {
        xPositions.push(xPositions[i] + cellWidthsCm[i] * pixelPerCm);
    }
    const yPositions = [0];
    for (let i = 0; i < totalHeightCells; i++) {
        yPositions.push(yPositions[i] + cellHeightsCm[i] * pixelPerCm);
    }

    return { xPositions, yPositions, cellWidthsCm, cellHeightsCm, pixelPerCm };
}

function createGrid() {
    const { fullWidthCells, totalWidthCells, remainderWidth, fullHeightCells, totalHeightCells, remainderHeight, xyz } = getCellCounts();
    if (totalWidthCells < 1 || totalHeightCells < 1) {
        alert('Vui lòng nhập kích thước ảnh hợp lệ!');
        return;
    }
    if (!displayImage.src || displayImage.style.display === 'none') {
        alert('Vui lòng tải ảnh trước!');
        return;
    }

    selectedCellIndices = selectedCellIndices.filter(([row, col]) => row < totalHeightCells && col < totalWidthCells);
    selectedCells = selectedCellIndices.length;

    const widthCm = parseFloat(widthMmInput.value) / 10;
    const heightCm = parseFloat(heightMmInput.value) / 10;
    const pixelPerCm = gridCanvas.width / widthCm;

    const cellWidthsCm = Array(totalWidthCells).fill(xyz);
    if (remainderWidth > 0) cellWidthsCm[totalWidthCells - 1] = remainderWidth;
    const cellHeightsCm = Array(totalHeightCells).fill(xyz);
    if (remainderHeight > 0) cellHeightsCm[totalHeightCells - 1] = remainderHeight;

    const xPositions = [0];
    for (let i = 0; i < totalWidthCells; i++) {
        xPositions.push(xPositions[i] + cellWidthsCm[i] * pixelPerCm);
    }
    const yPositions = [0];
    for (let i = 0; i < totalHeightCells; i++) {
        yPositions.push(yPositions[i] + cellHeightsCm[i] * pixelPerCm);
    }

    ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);

if (drawCanvas) {
    drawCanvas.width = gridCanvas.width;
    drawCanvas.height = gridCanvas.height;
}

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= totalWidthCells; i++) {
        const x = xPositions[i];
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, gridCanvas.height);
        ctx.stroke();
    }

    for (let i = 0; i <= totalHeightCells; i++) {
        const y = yPositions[i];
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(gridCanvas.width, y);
        ctx.stroke();
    }

    selectedCellIndices.forEach(([row, col, difficulty]) => {
        const left = xPositions[col];
        const top = yPositions[row];
        const fillWidth = cellWidthsCm[col] * pixelPerCm;
        const fillHeight = cellHeightsCm[row] * pixelPerCm;
        
        ctx.fillStyle = difficulty === 'very_easy' ? 'rgba(50, 205, 50, 0.3)' :
                        difficulty === 'easy' ? 'rgba(0, 0, 255, 0.3)' :
                        difficulty === 'medium' ? 'rgba(255, 215, 0, 0.3)' :
                        difficulty === 'hard' ? 'rgba(255, 165, 0, 0.3)' :
                        'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(left, top, fillWidth, fillHeight);
    });

    updateResult();
updateColorStats();  // ← THÊM DÒNG NÀY
}

function getPositionFromEvent(e) {
    const containerRect = imageContainer.getBoundingClientRect();
    let clientX, clientY;
    if (e.type.startsWith('touch')) {
        clientX = e.touches[0]?.clientX || e.changedTouches[0].clientX;
        clientY = e.touches[0]?.clientY || e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    return {
        x: Math.max(0, clientX - containerRect.left),
        y: Math.max(0, clientY - containerRect.top)
    };
}

function handleStart(e) {
    e.preventDefault();
    if (!displayImage.src || displayImage.style.display === 'none') return;

    // ===== CHẾ ĐỘ VẼ VÙNG =====
    if (isDrawingRegion) {
        startDrawRegion(e);
        return;
    }

    const pos = getPositionFromEvent(e);
    const target = e.target;

    if (isCropping && target.classList.contains('resize-handle') && cropData) {
        isResizing = true;
        resizeHandle = target.className.split(' ')[1];
        return;
    }

    if (!isCropping && isDragging && !isSelecting) {
        isSelecting = true;
        startX = pos.x;
        startY = pos.y;
        selectOverlay.style.display = 'block';
        selectOverlay.style.left = `${startX}px`;
        selectOverlay.style.top = `${startY}px`;
        selectOverlay.style.width = '0px';
        selectOverlay.style.height = '0px';
        selectData = { startX, startY, width: 0, height: 0 };
    } else if (!isCropping && !isDragging) {
        isSelecting = true;
        const { totalWidthCells, totalHeightCells } = getCellCounts();
        const { xPositions, yPositions } = getGridPositions();
        let col = 0, row = 0;
        for (let i = 0; i < totalWidthCells; i++) {
            if (pos.x >= xPositions[i] && pos.x < xPositions[i + 1]) {
                col = i;
                break;
            }
        }
        for (let i = 0; i < totalHeightCells; i++) {
            if (pos.y >= yPositions[i] && pos.y < yPositions[i + 1]) {
                row = i;
                break;
            }
        }
        if (row >= 0 && row < totalHeightCells && col >= 0 && col < totalWidthCells) {
            applyAreaSelection(row, col);
            updateCursorOverlay(pos, row, col);
            cursorOverlay.style.display = 'block';
        }
    }
}

function handleMove(e) {
    e.preventDefault();
    if (!displayImage.src || displayImage.style.display === 'none') return;

    // ===== CHẾ ĐỘ VẼ VÙNG =====
    if (isDrawingRegion) {
        moveDrawRegion(e);
        return;
    }

    const pos = getPositionFromEvent(e);
    const containerRect = imageContainer.getBoundingClientRect();
    const endX = Math.min(Math.max(pos.x, 0), containerRect.width);
    const endY = Math.min(Math.max(pos.y, 0), containerRect.height);

    if (isCropping && isResizing && cropData) {
        // ... giữ nguyên phần resize crop của bạn
        let { startX, startY, width, height } = cropData;
        switch (resizeHandle) {
            case 'top-left':
                width = cropData.startX + cropData.width - endX;
                height = cropData.startY + cropData.height - endY;
                startX = endX;
                startY = endY;
                break;
            case 'top-right':
                width = endX - cropData.startX;
                height = cropData.startY + cropData.height - endY;
                startY = endY;
                break;
            case 'bottom-left':
                width = cropData.startX + cropData.width - endX;
                height = endY - cropData.startY;
                startX = endX;
                break;
            case 'bottom-right':
                width = endX - cropData.startX;
                height = endY - cropData.startY;
                break;
            case 'top':
                height = cropData.startY + cropData.height - endY;
                startY = endY;
                break;
            case 'right':
                width = endX - cropData.startX;
                break;
            case 'bottom':
                height = endY - cropData.startY;
                break;
            case 'left':
                width = cropData.startX + cropData.width - endX;
                startX = endX;
                break;
        }
        if (width < 0) {
            startX += width;
            width = -width;
        }
        if (height < 0) {
            startY += height;
            height = -height;
        }
        cropOverlay.style.left = `${startX}px`;
        cropOverlay.style.top = `${startY}px`;
        cropOverlay.style.width = `${width}px`;
        cropOverlay.style.height = `${height}px`;
        cropData = { startX, startY, width, height };
    } else if (!isCropping && isDragging && isSelecting) {
        const left = Math.min(startX, endX);
        const top = Math.min(startY, endY);
        const width = Math.abs(endX - startX);
        const height = Math.abs(endY - startY);
        selectOverlay.style.left = `${left}px`;
        selectOverlay.style.top = `${top}px`;
        selectOverlay.style.width = `${width}px`;
        selectOverlay.style.height = `${height}px`;
        selectData = { startX: left, startY: top, width, height };
    } else if (!isCropping && !isDragging && isSelecting) {
        const { totalWidthCells, totalHeightCells } = getCellCounts();
        const { xPositions, yPositions } = getGridPositions();
        let col = 0, row = 0;
        for (let i = 0; i < totalWidthCells; i++) {
            if (pos.x >= xPositions[i] && pos.x < xPositions[i + 1]) {
                col = i;
                break;
            }
        }
        for (let i = 0; i < totalHeightCells; i++) {
            if (pos.y >= yPositions[i] && pos.y < yPositions[i + 1]) {
                row = i;
                break;
            }
        }
        if (row >= 0 && row < totalHeightCells && col >= 0 && col < totalWidthCells) {
            applyAreaSelection(row, col);
            updateCursorOverlay(pos, row, col);
            cursorOverlay.style.display = 'block';
        }
    }
}

function handleEnd(e) {
    // ===== CHẾ ĐỘ VẼ VÙNG =====
    if (isDrawingRegion) {
        endDrawRegion(e);
        return;
    }

    if (isCropping && isResizing) {
        isResizing = false;
        resizeHandle = null;
        if (cropData && cropData.width > 0 && cropData.height > 0) {
            // giữ khung
        } else {
            cropOverlay.style.display = 'none';
            cropData = null;
        }
    } else if (!isCropping && isDragging && isSelecting) {
        isSelecting = false;
        selectOverlay.style.display = 'none';
        applyDragSelection();
    } else if (!isCropping && !isDragging && isSelecting) {
        isSelecting = false;
        cursorOverlay.style.display = 'none';
    }
}

function cropImage() {
    if (!cropData || cropData.width <= 0 || cropData.height <= 0) {
        alert('Vùng cắt không hợp lệ! Vui lòng chọn lại vùng cắt.');
        cropOverlay.style.display = 'none';
        cropData = null;
        return;
    }

    const containerRect = imageContainer.getBoundingClientRect();
    const zoom = parseFloat(zoomSlider.value);
    const currentWidthPx = parseFloat(displayImage.style.width) || displayImage.naturalWidth;
    const pixelRatio = originalWidthPx / currentWidthPx;

    const cropX = Math.max(0, cropData.startX * pixelRatio);
    const cropY = Math.max(0, cropData.startY * pixelRatio);
    const cropWidthPx = Math.min(originalWidthPx - cropX, cropData.width * pixelRatio);
    const cropHeightPx = Math.min(originalHeightPx - cropY, cropData.height * pixelRatio);

    if (cropWidthPx <= 0 || cropHeightPx <= 0 || isNaN(cropWidthPx) || isNaN(cropHeightPx)) {
        alert('Vùng cắt không hợp lệ! Vui lòng chọn lại vùng cắt.');
        cropOverlay.style.display = 'none';
        cropData = null;
        return;
    }

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = cropWidthPx;
    canvas.height = cropHeightPx;
    ctx.drawImage(displayImage, cropX, cropY, cropWidthPx, cropHeightPx, 0, 0, cropWidthPx, cropHeightPx);

    displayImage.src = canvas.toDataURL();
    originalWidthPx = cropWidthPx;
    originalHeightPx = cropHeightPx;
    aspectRatio = originalWidthPx / originalHeightPx;
    imageInfo.textContent = `Kích thước ảnh: ${Math.round(originalWidthPx)}px x ${Math.round(originalHeightPx)}px`;

    cropData = null;
    cropOverlay.style.display = 'none';
    selectedCellIndices = [];
    selectedCells = 0;

    updateDimensions();
    createGrid();
}

function applyDragSelection() {
    if (!selectData) return;

    const { xPositions, yPositions } = getGridPositions();
    const { totalWidthCells, totalHeightCells } = getCellCounts();
    const difficulty = Array.from(document.getElementsByName('difficulty')).find(input => input.checked).value;

    let startCol = 0, startRow = 0, endCol = 0, endRow = 0;
    for (let i = 0; i < totalWidthCells; i++) {
        if (selectData.startX >= xPositions[i] && selectData.startX < xPositions[i + 1]) startCol = i;
        if (selectData.startX + selectData.width >= xPositions[i] && selectData.startX + selectData.width < xPositions[i + 1]) endCol = i;
    }
    endCol = Math.min(totalWidthCells - 1, endCol + 1);
    for (let i = 0; i < totalHeightCells; i++) {
        if (selectData.startY >= yPositions[i] && selectData.startY < yPositions[i + 1]) startRow = i;
        if (selectData.startY + selectData.height >= yPositions[i] && selectData.startY + selectData.height < yPositions[i + 1]) endRow = i;
    }
    endRow = Math.min(totalHeightCells - 1, endRow + 1);

    const mode = Array.from(selectionModeInputs).find(input => input.checked).value;

    for (let i = startRow; i <= endRow; i++) {
        for (let j = startCol; j <= endCol; j++) {
            const cellIndex = [i, j, difficulty];
            if (mode === 'select') {
                if (!selectedCellIndices.some(([r, c]) => r === i && c === j)) {
                    selectedCellIndices.push(cellIndex);
                    selectedCells++;
                } else {
                    selectedCellIndices = selectedCellIndices.map(item => 
                        item[0] === i && item[1] === j ? [i, j, difficulty] : item
                    );
                }
            } else if (mode === 'deselect') {
                selectedCellIndices = selectedCellIndices.filter(([r, c]) => r !== i || c !== j);
                selectedCells--;
            }
        }
    }

    selectData = null;
    createGrid();
updateColorStats();  // ← THÊM DÒNG NÀY
}

function applyAreaSelection(row, col) {
    const size = parseInt(selectionAreaSize.value);
    const mode = Array.from(selectionModeInputs).find(input => input.checked).value;
    const difficulty = Array.from(document.getElementsByName('difficulty')).find(input => input.checked).value;
    const { totalWidthCells, totalHeightCells } = getCellCounts();

    for (let i = row; i < Math.min(row + size, totalHeightCells); i++) {
        for (let j = col; j < Math.min(col + size, totalWidthCells); j++) {
            const cellIndex = [i, j, difficulty];
            if (mode === 'select') {
                if (!selectedCellIndices.some(([r, c]) => r === i && c === j)) {
                    selectedCellIndices.push(cellIndex);
                    selectedCells++;
                } else {
                    selectedCellIndices = selectedCellIndices.map(item => 
                        item[0] === i && item[1] === j ? [i, j, difficulty] : item
                    );
                }
            } else if (mode === 'deselect') {
                selectedCellIndices = selectedCellIndices.filter(([r, c]) => r !== i || c !== j);
                selectedCells--;
            }
        }
    }
    createGrid();
updateColorStats();  // ← THÊM DÒNG NÀY
}

function formatVND(number) {
    return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function updateCurrencyConversion(totalPriceVND) {
    const resultUSD = document.getElementById('resultUSD') || document.getElementById('resultVND');
    const resultEUR = document.getElementById('resultEUR');
    const exchangeRate = document.getElementById('exchangeRate');
    
    const defaultUsdRate = 25300;   // 1 USD = ? VND
    const defaultEurRate = 27500;   // 1 EUR = ? VND
    const apiUrl = 'https://open.er-api.com/v6/latest/USD';

    fetch(apiUrl)
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.result === 'success' && data.rates) {
                const usdToVnd = data.rates.VND || defaultUsdRate;
                const eurToVnd = data.rates.VND / data.rates.EUR || defaultEurRate;

                const totalUSD = (totalPriceVND / usdToVnd).toFixed(2);
                const totalEUR = (totalPriceVND / eurToVnd).toFixed(2);

                if (resultUSD) resultUSD.textContent = `≈ $${totalUSD} USD`;
                resultEUR.textContent = `≈ €${totalEUR} EUR`;
                exchangeRate.textContent = `Tỷ giá: 1 USD ≈ ${formatVND(Math.round(usdToVnd))} ₫ | 1 EUR ≈ ${formatVND(Math.round(eurToVnd))} ₫`;
            } else {
                useDefaultRates(totalPriceVND, defaultUsdRate, defaultEurRate);
            }
        })
        .catch(error => {
            console.error('Lỗi khi lấy tỉ giá:', error.message);
            useDefaultRates(totalPriceVND, defaultUsdRate, defaultEurRate);
        });

    function useDefaultRates(totalPriceVND, usdRate, eurRate) {
        const totalUSD = (totalPriceVND / usdRate).toFixed(2);
        const totalEUR = (totalPriceVND / eurRate).toFixed(2);
        if (resultUSD) resultUSD.textContent = `≈ $${totalUSD} USD (tỷ giá mặc định)`;
        resultEUR.textContent = `≈ €${totalEUR} EUR (tỷ giá mặc định)`;
        exchangeRate.textContent = `Tỷ giá mặc định: 1 USD = ${formatVND(usdRate)} ₫ | 1 EUR = ${formatVND(eurRate)} ₫`;
    }
}

function updateResult() {
    const { fullWidthCells, totalWidthCells, remainderWidth, fullHeightCells, totalHeightCells, remainderHeight, xyz } = getCellCounts();
    const cellWidthsCm = Array(totalWidthCells).fill(xyz);
    if (remainderWidth > 0) cellWidthsCm[totalWidthCells - 1] = remainderWidth;
    const cellHeightsCm = Array(totalHeightCells).fill(xyz);
    if (remainderHeight > 0) cellHeightsCm[totalHeightCells - 1] = remainderHeight;

    const areasByDifficulty = {
        very_easy: 0,
        easy: 0,
        medium: 0,
        hard: 0,
        very_hard: 0
    };

    selectedCellIndices.forEach(([row, col, difficulty]) => {
        const area = cellWidthsCm[col] * cellHeightsCm[row];
        areasByDifficulty[difficulty] += area;
    });

    const totalAreaCm2 = Object.values(areasByDifficulty).reduce((sum, area) => sum + area, 0);

    let pricePerCm2;

        const area = areasByDifficulty[difficulty];

            const adjustedPrice = pricePerCm2 * priceAdjustments[difficulty];
            const totalPrice = area * adjustedPrice;

            const color = difficulty === 'very_easy' ? 'limegreen' :

function updateCursorOverlay(pos, row, col) {
    const size = parseInt(selectionAreaSize.value);
    const { totalWidthCells, totalHeightCells } = getCellCounts();
    const { xPositions, yPositions, cellWidthsCm, cellHeightsCm, pixelPerCm } = getGridPositions();

    let overlayWidth = 0;
    for (let j = col; j < Math.min(col + size, totalWidthCells); j++) {
        overlayWidth += cellWidthsCm[j] * pixelPerCm;
    }
    let overlayHeight = 0;
    for (let i = row; i < Math.min(row + size, totalHeightCells); i++) {
        overlayHeight += cellHeightsCm[i] * pixelPerCm;
    }

    const left = xPositions[col];
    const top = yPositions[row];

    cursorOverlay.style.width = `${overlayWidth}px`;
    cursorOverlay.style.height = `${overlayHeight}px`;
    cursorOverlay.style.left = `${left}px`;
    cursorOverlay.style.top = `${top}px`;
}

async function autoSelect() {
    if (!displayImage.src || displayImage.style.display === 'none') {
        alert('Vui lòng tải ảnh và tạo lưới trước!');
        return;
    }

    const difficulty = Array.from(document.getElementsByName('difficulty')).find(input => input.checked)?.value || 'very_easy';
    const mode = Array.from(selectionModeInputs).find(input => input.checked).value;
    
    if (mode !== 'select') {
        alert('Vui lòng chọn chế độ "Chọn ô" trước khi dùng tự động!');
        return;
    }

    // CACHE IMAGE DATA - CHỈ TẠO 1 LẦN
    if (!cachedImageData || cachedTimestamp < Date.now() - 1000) {
        const canvas = document.createElement('canvas');
        const tempCtx = canvas.getContext('2d');
        canvas.width = originalWidthPx;
        canvas.height = originalHeightPx;
        tempCtx.drawImage(displayImage, 0, 0);
        cachedImageData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
        cachedPixels = cachedImageData.data;
        cachedTimestamp = Date.now();
    }

    const { totalWidthCells, totalHeightCells } = getCellCounts();
    const { xPositions, yPositions, cellWidthsCm, cellHeightsCm, pixelPerCm } = getGridPositions();
    const pixelsPerCm = originalWidthPx / (parseFloat(widthMmInput.value) / 10);

    selectedCellIndices = []; // Xóa lựa chọn cũ
    selectedCells = 0;

    // **DUYỆT TRỰC TIẾP - SIÊU NHANH**
    for (let row = 0; row < totalHeightCells; row++) {
        for (let col = 0; col < totalWidthCells; col++) {
            const leftPx = (xPositions[col] / pixelPerCm) * pixelsPerCm;
            const topPx = (yPositions[row] / pixelPerCm) * pixelsPerCm;
            const widthPx = cellWidthsCm[col] * pixelsPerCm;
            const heightPx = cellHeightsCm[row] * pixelsPerCm;

            if (checkCellHasContentFast(
                cachedPixels, originalWidthPx, originalHeightPx, 
                Math.floor(leftPx), Math.floor(topPx), 
                Math.floor(widthPx), Math.floor(heightPx)
            )) {
                selectedCellIndices.push([row, col, difficulty]);
                selectedCells++;
            }
        }
    }

    createGrid();
    updateResult();
    updateColorStats();
}

// ← THAY THẾ HÀM CŨ BẰNG HÀM NÀY
function checkCellHasContentFast(pixels, imgWidth, imgHeight, x, y, width, height) {
    let contentPixels = 0;
    let totalPixels = 0;
    const step = 4; // Sample mỗi 4 pixel → NHANH GẤP 4X
    
    for (let dy = 0; dy < height; dy += step) {
        for (let dx = 0; dx < width; dx += step) {
            const py = y + dy;
            const px = x + dx;
            if (py >= imgHeight || px >= imgWidth) continue;
            
            const idx = (py * imgWidth + px) * 4;
            totalPixels++;
            
            if (pixels[idx + 3] > 20) { // Alpha > 20
                const r = pixels[idx];
                const g = pixels[idx + 1];
                const b = pixels[idx + 2];
                
                if (!(r > 240 && g > 240 && b > 240)) {
                    contentPixels++;
                }
            }
        }
    }
    
    return (contentPixels / Math.max(totalPixels, 1)) > 0.08; // Giảm ngưỡng tí cho nhanh
}

// Cập nhật thống kê màu
function updateColorStats() {
    const stats = {
        very_easy: 0, easy: 0, medium: 0, hard: 0, very_hard: 0
    };
    
    selectedCellIndices.forEach(([row, col, difficulty]) => {
        stats[difficulty]++;
    });
    
    const statsDiv = document.getElementById('colorStats');
    let html = '';
    for (const [difficulty, count] of Object.entries(stats)) {
        if (count > 0) {
            const color = difficulty === 'very_easy' ? '🟢' :
                         difficulty === 'easy' ? '🔵' :
                         difficulty === 'medium' ? '🟡' :
                         difficulty === 'hard' ? '🟠' : '🔴';
            const label = difficulty === 'very_easy' ? 'Rất dễ' :
                         difficulty === 'easy' ? 'Dễ' :
                         difficulty === 'medium' ? 'Vừa' :
                         difficulty === 'hard' ? 'Khó' : 'Rất khó';
            html += `<span style="margin-right: 15px;">${color} ${label}: ${count} ô</span>`;
        }
    }
    statsDiv.innerHTML = html || 'Chưa chọn ô nào';
}

// Hàm đổi màu ô
function changeCellColor() {
    const fromColor = document.getElementById('fromColor').value;
    const toColor = document.getElementById('toColor').value;
    
    if (fromColor === toColor) {
        alert('⚠️ Vui lòng chọn 2 màu khác nhau!');
        return;
    }
    
    const beforeCount = selectedCellIndices.filter(([_, __, diff]) => diff === fromColor).length;
    if (beforeCount === 0) {
        alert(`⚠️ Không có ô màu "${getDifficultyLabel(fromColor)}" để đổi!`);
        return;
    }
    
    selectedCellIndices = selectedCellIndices.map(([row, col, difficulty]) => 
        difficulty === fromColor ? [row, col, toColor] : [row, col, difficulty]
    );
    
    createGrid();
    updateResult();
    updateColorStats();
}

// Hàm chọn tất cả ô của 1 màu
// ĐỔI TẤT CẢ MÀU - GIỮ NGUYÊN SỐ Ô!
function changeAllColor() {
    if (selectedCells === 0) {
        alert('⚠️ Chưa chọn ô nào để đổi màu!');
        return;
    }
    
    const newColor = document.getElementById('toColor').value;
    
    const beforeCount = selectedCells;
    
    // CHỈ ĐỔI MÀU - KHÔNG XÓA Ô NÀO!
    selectedCellIndices = selectedCellIndices.map(([row, col, _]) => 
        [row, col, newColor]  // Giữ nguyên vị trí, đổi màu
    );
    
    createGrid();
    updateResult();
    updateColorStats();
}

// Hàm hỗ trợ lấy tên màu
function getDifficultyLabel(difficulty) {
    const labels = {
        very_easy: 'Rất dễ',
        easy: 'Dễ', 
        medium: 'Vừa',
        hard: 'Khó',
        very_hard: 'Rất khó'
    };
    return labels[difficulty] || difficulty;
}

// Bắt đầu vẽ
function startDrawRegion(e) {
    if (!isDrawingRegion) return;
    isDrawing = true;
    drawPoints = [];
    const pos = getPositionFromEvent(e);
    drawPoints.push(pos);

    // Đảm bảo canvas đúng size
    if (drawCanvas.width !== gridCanvas.width || drawCanvas.height !== gridCanvas.height) {
        drawCanvas.width = gridCanvas.width;
        drawCanvas.height = gridCanvas.height;
    }

    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    drawCtx.beginPath();
    drawCtx.moveTo(pos.x, pos.y);
    drawCtx.strokeStyle = '#00aaff';
    drawCtx.lineWidth = 4;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
}

function moveDrawRegion(e) {
    if (!isDrawingRegion || !isDrawing) return;
    const pos = getPositionFromEvent(e);
    drawPoints.push(pos);

    drawCtx.lineTo(pos.x, pos.y);
    drawCtx.stroke();
}

function endDrawRegion(e) {
    if (!isDrawingRegion || !isDrawing) return;
    isDrawing = false;

    if (drawPoints.length > 8) {
        const first = drawPoints[0];
        const last = drawPoints[drawPoints.length - 1];
        const dist = Math.hypot(first.x - last.x, first.y - last.y);

        if (dist < 50) {
            // Đóng vòng và tô màu nhẹ
            drawCtx.lineTo(first.x, first.y);
            drawCtx.closePath();
            drawCtx.stroke();
            drawCtx.fillStyle = 'rgba(0, 170, 255, 0.2)';
            drawCtx.fill();
        }
    }
}

// Xóa vùng đang vẽ
function clearDrawnRegion() {
    drawPoints = [];
    isDrawing = false;
    if (drawCtx) {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }
}

// Kiểm tra điểm có nằm trong polygon không (ray-casting)
function isPointInPolygon(point, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;
        
        const intersect = ((yi > point.y) !== (yj > point.y)) &&
            (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

// Xác nhận vùng → chọn tất cả ô nằm bên trong
function confirmDrawnRegion() {
    if (drawPoints.length < 10) {
        alert('Vùng vẽ quá nhỏ hoặc chưa vẽ! Hãy vẽ một vòng kín quanh vùng cần chọn.');
        return;
    }

    const difficulty = Array.from(document.getElementsByName('difficulty'))
        .find(input => input.checked)?.value || 'very_easy';

    const { totalWidthCells, totalHeightCells } = getCellCounts();
    const { xPositions, yPositions, cellWidthsCm, cellHeightsCm, pixelPerCm } = getGridPositions();

    let added = 0;

    for (let row = 0; row < totalHeightCells; row++) {
        for (let col = 0; col < totalWidthCells; col++) {
            // Lấy tâm của ô
            const centerX = xPositions[col] + (cellWidthsCm[col] * pixelPerCm) / 2;
            const centerY = yPositions[row] + (cellHeightsCm[row] * pixelPerCm) / 2;

            if (isPointInPolygon({ x: centerX, y: centerY }, drawPoints)) {
                // Chỉ thêm nếu chưa có
                if (!selectedCellIndices.some(([r, c]) => r === row && c === col)) {
                    selectedCellIndices.push([row, col, difficulty]);
                    selectedCells++;
                    added++;
                } else {
                    // Cập nhật độ khó nếu đã tồn tại
                    selectedCellIndices = selectedCellIndices.map(item =>
                        item[0] === row && item[1] === col ? [row, col, difficulty] : item
                    );
                }
            }
        }
    }

    createGrid();
    updateResult();
    updateColorStats();
    clearDrawnRegion();

    alert(`Đã chọn thêm ${added} ô nằm trong vùng vẽ!`);
}
// Sự kiện vẽ vùng
drawCanvas.addEventListener('mousedown', startDrawRegion);
drawCanvas.addEventListener('mousemove', moveDrawRegion);
drawCanvas.addEventListener('mouseup', endDrawRegion);
drawCanvas.addEventListener('mouseleave', endDrawRegion);

drawCanvas.addEventListener('touchstart', startDrawRegion, { passive: false });
drawCanvas.addEventListener('touchmove', moveDrawRegion, { passive: false });
drawCanvas.addEventListener('touchend', endDrawRegion, { passive: false });
    </script>
